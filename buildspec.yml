version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI
  build:
    commands:
      - docker build -f Dockerfile.modelos -t $ECR_URI/minetrac-modelos:1.0 .
  post_build:
    commands:
      - docker push $ECR_URI/minetrac-modelos:1.0
